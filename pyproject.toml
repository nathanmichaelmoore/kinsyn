[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinsyn"
version = "0.1.0"
description = "Planar kinematic synthesis tool (four-bar and slider linkages)"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "pyside6", "pyqtgraph", "ezdxf"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
kinsyn = "kinsyn.gui.app:main"

[tool.setuptools.packages.find]
include = ["kinsyn*"]

[tool.setuptools.package-data]
"kinsyn.library" = ["builtin/*.json"]
"kinsyn.help" = ["docs/*.md", "docs/*/*.md", "docs/img/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
